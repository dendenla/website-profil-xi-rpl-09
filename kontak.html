<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak | XI RPL 09</title>
    <!-- Three.js Library untuk efek 3D Luar Angkasa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      :root {
        --text: #e8fbff;
        --muted: #a9d3df;
        --white: #ffffff;
        --glow: rgba(127, 245, 229, 0.6);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", Arial, sans-serif;
        color: var(--text);
        background-color: #030712;
        overflow-x: hidden;
      }

      /* Canvas 3D Latar Belakang */
      #space-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }

      header {
        padding: 24px 8%;
        color: var(--white);
        background: rgba(3, 7, 18, 0.4);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(127, 245, 229, 0.15);
        position: relative;
        z-index: 10;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        max-width: 1100px;
        margin: auto;
      }

      .logo {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 1px;
        font-weight: bold;
        text-shadow: 0 0 10px var(--glow);
      }

      .school-link {
        display: flex;
        gap: 18px;
        align-items: center;
      }

      .school-link a, .back-link {
        color: #d9fff7;
        text-decoration: none;
        font-size: 0.95rem;
        transition: color 0.3s;
      }

      .school-link a:hover, .back-link:hover {
        color: #7ff5e5;
        text-shadow: 0 0 8px #7ff5e5;
      }

      main {
        max-width: 1100px;
        margin: auto;
        padding: 60px 8%;
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .intro {
        max-width: 720px;
        margin-bottom: 30px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #7ff5e5;
        font-size: 0.85rem;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-shadow: 0 0 10px #7ff5e5;
      }

      h1 {
        margin: 0 0 14px;
        color: var(--white);
        font-size: clamp(2.2rem, 5vw, 3.8rem);
        line-height: 1.1;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      }

      .intro p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .address-card {
        display: flex;
        align-items: center;
        gap: 18px;
        max-width: 600px;
        width: 100%;
        margin-bottom: 40px;
        padding: 20px 24px;
        background: rgba(8, 25, 55, 0.4);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(127, 245, 229, 0.25);
        border-radius: 16px;
        box-shadow: 0 0 30px rgba(8, 126, 139, 0.2);
        text-align: left;
      }

      .address-icon {
        display: grid;
        flex: 0 0 48px;
        width: 48px;
        height: 48px;
        place-items: center;
        color: #030712;
        background: #7ff5e5;
        border-radius: 50%;
        font-size: 1.4rem;
        box-shadow: 0 0 15px #7ff5e5;
      }

      .address-card h2 { margin: 0 0 4px; color: #d9fff7; font-size: 1.05rem; }
      .address-card p { margin: 0 0 8px; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }

      .map-link {
        color: #7ff5e5;
        font-size: 0.85rem;
        font-weight: bold;
        text-decoration: none;
      }

      .map-link:hover { text-decoration: underline; }

      /* Tampilan Ikon Kontak Saja (Text Disembunyikan) */
      .contact-list {
        display: flex;
        justify-content: center;
        gap: 25px;
        flex-wrap: wrap;
      }

      .contact-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        text-decoration: none;
        background: rgba(10, 30, 60, 0.5);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(127, 245, 229, 0.3);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }

      .contact-card:hover {
        transform: translateY(-8px) scale(1.1);
        border-color: #7ff5e5;
      }

      .icon {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        color: var(--white);
        border-radius: 50%;
      }

      .icon svg {
        width: 26px;
        height: 26px;
        fill: currentColor;
      }

      .whatsapp-card:hover {
        box-shadow: 0 0 25px rgba(37, 211, 102, 0.8);
      }
      .whatsapp-icon { background: #25d366; }

      .email-card:hover {
        box-shadow: 0 0 25px rgba(234, 67, 53, 0.8);
      }
      .email-icon { background: #ea4335; }

      .tiktok-card:hover {
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
      }
      .tiktok-icon { background: #111111; border: 1px solid rgba(255, 255, 255, 0.2); }

      footer {
        padding: 30px;
        color: var(--muted);
        text-align: center;
        font-size: 0.85rem;
        position: relative;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <!-- Canvas untuk Objek 3D (Bintang & Planet) -->
    <canvas id="space-bg"></canvas>

      <nav aria-label="Navigasi utama">

        <span class="school-link">

    </header>

    <main>

        <p class="eyebrow">Hubungi kami</p>

      <section class="address-card" aria-label="Alamat sekolah">

        <span>
          <h2>Alamat Sekolah</h2>
          <p>SMK Negeri 1 Garut, Jl. Cimanuk No. 309, Tarogong Kidul, Garut, Jawa Barat 44151</p>
          <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=SMK+Negeri+1+Garut" target="_blank" rel="noopener noreferrer">Buka di Google Maps</a>

      <section class="contact-list" aria-label="Daftar kontak">
        <a class="contact-card whatsapp-card" href="https://wa.me/6282297590073" target="_blank" rel="noopener noreferrer" title="WhatsApp">

              <path d="M12 2a9.9 9.9 0 0 0-8.57 14.86L2 22l5.3-1.39A10 10 0 1 0 12 2Zm0 17.9a8 8 0 0 1-4.08-1.12l-.29-.17-3.15.83.84-3.06-.19-.31A8 8 0 1 1 12 19.9Zm4.39-5.98c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-1.39-.69-2.3-1.23-3.22-2.78-.24-.41.24-.38.69-1.27.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.41-.54-.42h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62 1.52.66 2.12.72 2.88.61.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z" />
            </svg>
          </span>

        <a class="contact-card email-card" href="mailto:razqsondari52@email.com" title="Email">
          <span class="icon email-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 5h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v.51l9 5.63 9-5.63V7H3Zm18 10V9.87l-8.47 5.3a1 1 0 0 1-1.06 0L3 9.87V17h18Z" />

        <a class="contact-card tiktok-card" href="https://www.tiktok.com/@raxzszs" target="_blank" rel="noopener noreferrer" title="TikTok">
          <span class="icon tiktok-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M16.6 3c.27 1.48 1.1 2.63 2.4 3.42.75.45 1.55.67 2.4.7v3.2a8.2 8.2 0 0 1-4.77-1.48v6.43c0 3.25-2.55 5.73-5.82 5.73A5.7 5.7 0 0 1 5 15.28a5.7 5.7 0 0 1 6.42-5.65v3.27a2.52 2.52 0 0 0-3.18 2.38c0 1.38 1.16 2.43 2.56 2.43 1.59 0 2.63-1.03 2.63-2.58V3h3.17Z" />
            </svg>
          </span>
        </a>
      </section>
    </main>

    <footer>&copy; 2026 XI RPL 09</footer>

    <!-- Script Rendering 3D Space Scene -->
    <script>
      const canvas = document.getElementById('space-bg');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // 1. Tambah Bintang-bintang (Starfield)
      const starsGeometry = new THREE.BufferGeometry();
      const starsCount = 1500;
      const starPositions = new Float32Array(starsCount * 3);

      for(let i = 0; i < starsCount * 3; i++) {
        starPositions[i] = (Math.random() - 0.5) * 1000;
      }
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

      const starsMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 1.2,
        transparent: true,
        opacity: 0.8
      });
      const starField = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(starField);

      // 2. Planet 3D (Diposisikan di (0,0,0) untuk posisi tengah & ukuran diperbesar ke 5)
      const planetGeo = new THREE.SphereGeometry(5, 64, 64);
      const planetMat = new THREE.MeshStandardMaterial({
        color: 0x0a2540, // Biru Tua
        roughness: 0.4,
        wireframe: true
      });
      const planet = new THREE.Mesh(planetGeo, planetMat);
      planet.position.set(0, 0, 0);
      scene.add(planet);

      // 3. Cincin Planet (Diposisikan di (0,0,0) & skala disesuaikan)
      const ringGeo = new THREE.RingGeometry(6.5, 9, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x1d4ed8, // Biru Tua Cerah
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.6,
        wireframe: true
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.set(0, 0, 0);
      ring.rotation.x = Math.PI / 2.5;
      scene.add(ring);

      // 4. Pencahayaan (Lighting)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x3b82f6, 2, 100);
      pointLight.position.set(10, 10, 10);
      scene.add(pointLight);

      camera.position.z = 12; // Menyesuaikan jarak kamera untuk ukuran baru

      // Animasi 3D Rotasi
      function animate() {
        requestAnimationFrame(animate);

        starField.rotation.y += 0.0003;
        starField.rotation.x += 0.0001;

        planet.rotation.y += 0.003;
        ring.rotation.z -= 0.002;

        renderer.render(scene, camera);
      }

      animate();

      // Responsif saat resize jendela browser
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
